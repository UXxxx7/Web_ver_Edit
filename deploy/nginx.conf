# Reverse proxy to the `web` container. apps/api is never exposed here —
# every browser-facing call goes through Next.js Server Actions/route
# handlers, which reach `api` over the internal Docker network (see
# docker-compose.yml) — confirmed by grepping for API_BASE_URL usage:
# every hit is in a "use server" file or a route.ts handler, none in a
# "use client" component.
#
# HTTPS required, not optional: lib/auth.ts sets the session cookie with
# secure: NODE_ENV === "production", so over plain HTTP the browser just
# silently drops the cookie — login "succeeds" (200) but every subsequent
# page looks logged-out again (confirmed live: every /agent, /videos,
# /community, /profile request kept 307-ing back to /login). No custom
# domain was wanted for this small-scale deployment, so the cert is issued
# for a nip.io wildcard hostname (146-190-96-189.nip.io — resolves back to
# this box's own IP, a real publicly-resolvable name, so Let's Encrypt's
# HTTP-01 challenge works against it same as any other domain) instead of a
# purchased one.
server {
    listen 80;
    server_name 146-190-96-189.nip.io;
    # Renewal needs this path reachable over plain HTTP even after HTTPS is
    # otherwise enforced (certbot's default webroot/standalone challenge).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 146-190-96-189.nip.io;

    ssl_certificate     /etc/letsencrypt/live/146-190-96-189.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/146-190-96-189.nip.io/privkey.pem;

    # Matches apps/web's own Server Action body limit (next.config.ts's
    # serverActions.bodySizeLimit / proxyClientMaxBodySize — both set to
    # 512mb for large video uploads). Nginx's own default (1MB) would
    # truncate any real video upload before it even reaches Next.js.
    client_max_body_size 512m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Video uploads/long-running renders — don't time out a slow upload
        # or a Server Action that's genuinely still working.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
